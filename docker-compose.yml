services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jengabank
      POSTGRES_USER: jenga
      POSTGRES_PASSWORD: jenga
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jenga -d jengabank"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/jengabank
      SPRING_DATASOURCE_USERNAME: jenga
      SPRING_DATASOURCE_PASSWORD: jenga
    ports:
      - "8080:8080"
    # No internet access at runtime: nothing is downloaded once the container runs.
    read_only: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  pgdata:
