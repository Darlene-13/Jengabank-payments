# Local development only. JengaSec provides PostgreSQL 16 on the range.
# Mirrors the range limits so problems show up here first.
#   docker compose up -d db          # just the database, run the app from your IDE
#   docker compose up --build        # database + the real image, like the range

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jengabank_payments
      POSTGRES_USER: jengabank
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-local-dev-only}
    ports:
      - "127.0.0.1:5432:5432"            # localhost only, never your whole network
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jengabank -d jengabank_payments"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      platforms: ["linux/amd64"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/jengabank_payments
      DB_USER: jengabank
      DB_PASSWORD: ${LOCAL_DB_PASSWORD:-local-dev-only}
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cpus: "1.5"                           # range gives 2 CPU / 3 GB for app + database together
    mem_limit: 2g

volumes:
  pgdata:
