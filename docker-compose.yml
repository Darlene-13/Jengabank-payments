
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jengabank_payments
      POSTGRES_USER: jengabank
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-local-dev-only}
    ports:
      - "127.0.0.1:${LOCAL_DB_PORT:-5433}:5432"   # localhost only; 5433 so it never clashes with a native Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jengabank -d jengabank_payments"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      platforms: ["linux/amd64"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/jengabank_payments
      DB_USER: jengabank
      DB_PASSWORD: ${LOCAL_DB_PASSWORD:-local-dev-only}
      SWAGGER_UI_ENABLED: "true"            # local only; the image keeps it off
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cpus: "1.5"
    mem_limit: 2g

volumes:
  pgdata:
